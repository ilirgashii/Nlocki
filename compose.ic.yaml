services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.ic
    platform: linux/amd64
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:4943:4943"
    volumes:
      - nlocki-data:/data
    environment:
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      AUTH_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    stop_grace_period: 60s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:5173'),fetch('http://127.0.0.1:5173/api/auth/config')]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
volumes:
  nlocki-data:
